services:
  listenarr:
    # Pinned to an immutable SHA-suffixed tag, not the rolling :beta tag, so the
    # server only moves when this file changes. Roll back by editing this line.
    image: ghcr.io/nexalapp/listenarr:beta-1.14.0-6e832ff
    container_name: listenarr
    ports:
      - "4545:4545"
    environment:
      - PUID=99
      - PGID=100
      - UMASK=022
      - TZ=America/Denver
    volumes:
      - /mnt/user/appdata/listenarr:/app/config

      # Read-only until a full scan has been eyeballed. Writable is what imports
      # need - nothing can be placed into a :ro library - but writable also lets
      # the renamer move every one of the 439G of existing files, and that scan
      # has not been checked against the path parsing yet. Drop the :ro (and take
      # a backup of the share) once it has.
      - /mnt/user/audiobooks:/audiobooks:ro

      # Lowercase: the share is /mnt/user/downloads, and nzbget binds that same
      # source at this same destination. Capitalised, Docker silently creates an
      # empty /mnt/user/Downloads and every import fails looking into it.
      #
      # Mounted at /downloads to match the path the download client reports, so no
      # remote path mapping is needed: NZBGet says
      # /downloads/completed/<category>/<release> and Listenarr resolves exactly
      # that. Without this mount, every import fails with "No importable files
      # found" while the file sits plainly visible on the share.
      #
      # Read-write on purpose. The mover renames rather than copies when source and
      # destination share a volume, and a rename needs to remove the original.
      - /mnt/user/downloads:/downloads
    restart: unless-stopped
    labels:
      net.unraid.docker.managed: composeman
      net.unraid.docker.webui: "http://nas.local:4545"
      net.unraid.docker.icon: "https://raw.githubusercontent.com/Listenarrs/Listenarr/canary/fe/public/favicon.svg"
